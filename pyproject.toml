[project]
name = "docuintel-ai"
version = "2.0.0"
description = "Multi-tenant retrieval-augmented generation with PostgreSQL, neural retrieval, and reproducible public evaluations."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.129,<1",
    "uvicorn[standard]>=0.40,<1",
    "python-dotenv>=1.2,<2",
    "pydantic>=2.13,<3",
    "python-multipart>=0.0.9,<1",
    "pypdf>=6.6,<8",
    "slowapi>=0.1.9,<1",
    "langchain>=1.2,<2",
    "langchain-core>=1.2,<2",
    "langchain-openai>=1.1,<2",
    "langchain-chroma>=1.1,<2",
    "langchain-text-splitters>=1.1,<2",
    "langsmith>=0.8,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "redis>=5,<7",
    "prometheus-client>=0.21,<1",
    "sentence-transformers>=5,<6",
    "torch>=2.2,<3",
    "sentencepiece>=0.2,<1",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "httpx>=0.28,<1"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
