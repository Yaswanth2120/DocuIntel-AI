name: validation
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run ruff check app evals scripts tests
      - run: uv run ruff format --check app evals scripts tests
      - run: uv run python -m unittest discover -s tests -t .
      - run: uv run python -m evals.check_reports
  shared-storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: ci-admin-only
          POSTGRES_DB: docuintel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d docuintel"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run python scripts/bootstrap_db.py
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:ci-admin-only@127.0.0.1:5432/docuintel
          APP_DB_PASSWORD: ci-app-only
      - run: uv run python -m unittest tests.test_shared_storage
        env:
          TEST_DATABASE_URL: postgresql://docuintel_app:ci-app-only@127.0.0.1:5432/docuintel
          TEST_REDIS_URL: redis://127.0.0.1:6379/1
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
      - run: uv sync --frozen --python 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/e2e/package-lock.json
      - run: npm ci
        working-directory: frontend/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: frontend/e2e
      - run: ./frontend/e2e/run.sh
        env:
          BACKEND_MODE: local
          PYTHON: .venv/bin/python
          PW_CHANNEL: chromium
