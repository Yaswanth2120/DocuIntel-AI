name: docuintel-ai
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: docuintel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup_local.py first}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docuintel"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/setup_local.py first}
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction']
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]
  migrate:
    image: docuintelai
    build: .
    environment:
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/docuintel
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run scripts/setup_local.py first}
    command: ["python", "scripts/bootstrap_db.py"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
  api:
    build: .
    image: docuintelai
    ports: ["127.0.0.1:8000:8000"]
    environment:
      METRICS_API_KEY: ${METRICS_API_KEY:-}
      APP_ENV: ${APP_ENV:-development}
      TENANT_API_KEYS: ${TENANT_API_KEYS:?Run scripts/setup_local.py first}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${DOCKER_OPENAI_BASE_URL:-${OPENAI_BASE_URL:-}}
      MODEL_REASONING_EFFORT: ${MODEL_REASONING_EFFORT:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.0}
      RATE_LIMIT: ${RATE_LIMIT:-30/minute}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-512}
      INPUT_USD_PER_MILLION: ${INPUT_USD_PER_MILLION:-}
      OUTPUT_USD_PER_MILLION: ${OUTPUT_USD_PER_MILLION:-}
      MAX_EXTRACTED_CHARS: ${MAX_EXTRACTED_CHARS:-2000000}
      MAX_DOCUMENT_CHUNKS: ${MAX_DOCUMENT_CHUNKS:-5000}
      RETRIEVAL_CACHE_TTL: ${RETRIEVAL_CACHE_TTL:-60}
      RAG_MAX_CHUNKS_PER_DOCUMENT: ${RAG_MAX_CHUNKS_PER_DOCUMENT:-2}
      RAG_RERANK_CANDIDATES: ${RAG_RERANK_CANDIDATES:-40}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_TENANT_DOCUMENTS: ${MAX_TENANT_DOCUMENTS:-10000}
      MAX_TENANT_BYTES: ${MAX_TENANT_BYTES:-1073741824}
      MAX_TENANT_CHUNKS: ${MAX_TENANT_CHUNKS:-200000}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}
      DATABASE_URL: postgresql://docuintel_app:${APP_DB_PASSWORD}@postgres:5432/docuintel
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      EMBEDDING_BACKEND: sentence_transformers
      RERANKER_BACKEND: cross_encoder
      RAG_DEFAULT_MODE: hybrid
      RAG_DEFAULT_RERANK: "true"
      GROUNDING_VERIFIER: nli
      HF_HOME: /models
      MODEL_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    volumes: [modelcache:/models]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 15s
      timeout: 8s
      start_period: 120s
      retries: 5
    restart: unless-stopped
    networks: [default, backend]
networks:
  backend:
    internal: true
volumes:
  pgdata:
  redisdata:
  modelcache:
